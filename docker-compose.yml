# Seat sign-up app: three own services + database, cache and broker,
# split into three networks, with a firewall in front of every service.
# The database has a standby copy and the broker is a cluster of three nodes.
# Run:  docker compose up -d --build     Open: http://localhost:8080
name: signup_seats

# ---------------------------------------------------------------------------
# Networks (stage 4). Every container has a fixed address, because firewall
# rules are written against addresses.
#
#   public    172.28.1.0/24   gateway .10
#   internal  172.28.2.0/24   gateway .10, booking .20, notifier .30
#   data      172.28.3.0/24   booking .20, notifier .30,
#                             postgres .40, postgres-standby .41, redis .50,
#                             rabbit1 .61, rabbit2 .62, rabbit3 .63
# ---------------------------------------------------------------------------
networks:
  public:
    ipam:
      config:
        - subnet: 172.28.1.0/24
  internal:
    internal: true        # no way out of Docker from this network
    ipam:
      config:
        - subnet: 172.28.2.0/24
  data:
    ipam:
      config:
        - subnet: 172.28.3.0/24

# ---------------------------------------------------------------------------
# Firewall helpers. Each service has one helper container "fw-<name>" that
#   - owns the network interfaces and addresses of that service,
#   - puts the iptables rules from firewall/rules/<name>.rules in place,
#   - is the only one allowed to change them (NET_ADMIN).
# The service itself then plugs into the helper's network
# (network_mode: "service:fw-<name>") and has no right to touch the rules.
# ---------------------------------------------------------------------------
x-firewall: &firewall
  build: ./firewall
  image: signup_seats-firewall
  cap_add:
    - NET_ADMIN
  init: true
  volumes:
    - ./firewall/rules:/rules:ro
  healthcheck:
    test: ["CMD", "test", "-f", "/tmp/fw-ready"]
    interval: 2s
    timeout: 2s
    retries: 15
  restart: unless-stopped

# ---------------------------------------------------------------------------
# One RabbitMQ node (stage 5). The three nodes share the same settings; nodes
# with the same Erlang cookie and the node list in rabbitmq/cluster.conf form
# one cluster.
# ---------------------------------------------------------------------------
x-rabbit: &rabbit
  image: rabbitmq:3.13-management-alpine
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?set RABBITMQ_ERLANG_COOKIE in .env}
  volumes:
    - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
  healthcheck:
    # Passes only when the node has finished starting and accepts connections.
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
    interval: 10s
    timeout: 8s
    retries: 12
    start_period: 30s
  restart: unless-stopped

services:
  # ------------------------------ firewall helpers ------------------------------
  fw-gateway:
    <<: *firewall
    environment:
      FW_NAME: gateway
    ports:
      - "8080:80"         # the only port open to users
    networks:
      public:
        ipv4_address: 172.28.1.10
      internal:
        ipv4_address: 172.28.2.10
        aliases: [gateway]

  fw-booking:
    <<: *firewall
    environment:
      FW_NAME: booking
    networks:
      internal:
        ipv4_address: 172.28.2.20
        aliases: [booking]
      data:
        ipv4_address: 172.28.3.20

  fw-notifier:
    <<: *firewall
    environment:
      FW_NAME: notifier
    networks:
      internal:
        ipv4_address: 172.28.2.30
        aliases: [notifier]
      data:
        ipv4_address: 172.28.3.30

  fw-postgres:
    <<: *firewall
    environment:
      FW_NAME: postgres
    networks:
      data:
        ipv4_address: 172.28.3.40
        aliases: [postgres]

  fw-postgres-standby:
    <<: *firewall
    environment:
      FW_NAME: postgres-standby
    networks:
      data:
        ipv4_address: 172.28.3.41
        aliases: [postgres-standby]

  fw-redis:
    <<: *firewall
    environment:
      FW_NAME: redis
    networks:
      data:
        ipv4_address: 172.28.3.50
        aliases: [redis]

  # RabbitMQ names its data after the host name, so each node gets a fixed one.
  fw-rabbit1:
    <<: *firewall
    environment:
      FW_NAME: rabbit1
    hostname: rabbit1
    ports:
      - "127.0.0.1:15672:15672"   # web console, reachable from this laptop only
    networks:
      data:
        ipv4_address: 172.28.3.61
        aliases: [rabbit1]

  fw-rabbit2:
    <<: *firewall
    environment:
      FW_NAME: rabbit2
    hostname: rabbit2
    ports:
      - "127.0.0.1:15673:15672"   # second console, for when rabbit1 is down
    networks:
      data:
        ipv4_address: 172.28.3.62
        aliases: [rabbit2]

  fw-rabbit3:
    <<: *firewall
    environment:
      FW_NAME: rabbit3
    hostname: rabbit3
    networks:
      data:
        ipv4_address: 172.28.3.63
        aliases: [rabbit3]

  # ---------------------------------- services ----------------------------------

  # Front: static page + reverse proxy to the back end. The only user entry point.
  gateway:
    image: nginx:1.27-alpine
    network_mode: "service:fw-gateway"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/static:/usr/share/nginx/html:ro
    depends_on:
      fw-gateway:
        condition: service_healthy
      booking:
        condition: service_started
    restart: unless-stopped

  # Back: REST API. Works with the database, the cache and the broker.
  booking:
    build: ./booking
    network_mode: "service:fw-booking"
    environment:
      PORT: "8080"
      # PostgreSQL (the Go driver reads these standard PG* variables itself).
      # Two hosts: the driver tries them in order and keeps the one that
      # accepts writes, so after a failover it finds the new primary by itself.
      PGHOST: postgres,postgres-standby
      PGPORT: "5432"
      PGTARGETSESSIONATTRS: read-write
      PGCONNECT_TIMEOUT: "3"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable
      # Redis
      REDIS_ADDR: redis:6379
      # RabbitMQ: the three cluster nodes, tried in order.
      RABBITMQ_HOSTS: rabbit1,rabbit2,rabbit3
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      fw-booking:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
      rabbit3:
        condition: service_healthy
    restart: unless-stopped

  # Separate action: consumes sign-up events from the broker and logs confirmations.
  notifier:
    build: ./notifier
    network_mode: "service:fw-notifier"
    environment:
      PORT: "8081"
      RABBITMQ_HOSTS: rabbit1,rabbit2,rabbit3
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      fw-notifier:
        condition: service_healthy
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
      rabbit3:
        condition: service_healthy
    restart: unless-stopped

  # Database, primary: accepts reads and writes.
  postgres:
    image: postgres:16-alpine
    network_mode: "service:fw-postgres"
    command: ["postgres", "-c", "wal_keep_size=256MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?set POSTGRES_REPLICATION_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # PostgreSQL runs these two files once, when the data volume is empty:
      # the schema, then the preparation for replication.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/replication.sh:/docker-entrypoint-initdb.d/02-replication.sh:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      fw-postgres:
        condition: service_healthy
    restart: unless-stopped

  # Database, standby: a live copy of the primary. Read-only until promoted.
  postgres-standby:
    image: postgres:16-alpine
    network_mode: "service:fw-postgres-standby"
    entrypoint: ["sh", "/standby.sh"]
    command: ["postgres", "-c", "wal_keep_size=256MB"]
    environment:
      PRIMARY_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - pgdata_standby:/var/lib/postgresql/data
      - ./db/standby.sh:/standby.sh:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      fw-postgres-standby:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Cache
  redis:
    image: redis:7-alpine
    network_mode: "service:fw-redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      fw-redis:
        condition: service_healthy
    restart: unless-stopped

  # Message broker: a cluster of three nodes.
  # Web consoles: http://localhost:15672 (rabbit1), http://localhost:15673 (rabbit2).
  rabbit1:
    <<: *rabbit
    network_mode: "service:fw-rabbit1"
    depends_on:
      fw-rabbit1:
        condition: service_healthy

  # rabbit2 and rabbit3 start right after rabbit1 and join its cluster.
  # They must NOT wait for rabbit1 to be healthy: when an existing cluster is
  # started again, rabbit1 itself waits for the other nodes, and waiting on
  # each other would block the start forever.
  rabbit2:
    <<: *rabbit
    network_mode: "service:fw-rabbit2"
    depends_on:
      fw-rabbit2:
        condition: service_healthy
      rabbit1:
        condition: service_started

  rabbit3:
    <<: *rabbit
    network_mode: "service:fw-rabbit3"
    depends_on:
      fw-rabbit3:
        condition: service_healthy
      rabbit1:
        condition: service_started

volumes:
  pgdata:
  pgdata_standby:
